spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:flowable}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:flowable}
    password: ${MYSQL_PASSWORD:flowable}

flowable:
  database-schema-update: true
  async-executor-activate: true

logging:
  level:
    org.flowable: WARN
    com.flowable: INFO
